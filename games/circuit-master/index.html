<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Circuit Master Pro // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #090e17; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(9, 14, 23, 0.85); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #ef4444; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #94a3b8; }
    .tire-bar { width: 120px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .tire-bar-fill { width: 100%; height: 100%; background: #22c55e; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(9, 14, 23, 0.85); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 5px; color: #ef4444; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">SPEED // GEAR</div>
        <div class="hud-val" id="hud-speed">0 <span style="font-size:0.85rem;color:#ef4444;">KM/H</span></div>
        <div class="hud-sub" id="hud-drs">DRS: AVAILABLE [SPACE]</div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">TIRE WEAR // HEAT</div>
        <div class="hud-val" id="hud-wear" style="color:#22c55e;">98%</div>
        <div class="tire-bar"><div class="tire-bar-fill" id="hud-tire-bar"></div></div>
        <div class="hud-sub" id="hud-temp" style="margin-top:2px;">TEMP: 92°C (OPTIMAL)</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">LAP DELTA TIME</div>
        <div class="hud-val" id="hud-lap" style="color:#ef4444;">00:00.0</div>
        <div class="hud-sub">DELTA: -0.142s (PURPLE)</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>W/↑</kbd> Throttle • <kbd>S/↓</kbd> Brake • <kbd>A/D</kbd> Precision Steering • <kbd>SPACE</kbd> DRS Wing Open
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
