<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velocity: Autobahn Pursuit // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; color: #f9fafb; font-family: 'Segoe UI', system-ui, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #0b0f19; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #94a3b8; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 1px 5px; color: #38bdf8; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">SPEED // DRAG COEFF</div>
        <div class="hud-val" id="hud-speed">0 <span style="font-size:0.85rem;color:#38bdf8;">KM/H</span></div>
        <div class="hud-sub" id="hud-drag">Cd: 0.28 • DRAFTING: OFF</div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">NEAR-MISS COMBOS</div>
        <div class="hud-val" id="hud-score" style="color:#00ff88;">0</div>
        <div class="hud-sub" id="hud-mult">SPEED BONUS: x1.0</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">AUTOBAHN KM</div>
        <div class="hud-val" id="hud-dist" style="color:#38bdf8;">0.00 KM</div>
        <div class="hud-sub">TRAFFIC DENSITY: HEAVY</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>W/↑</kbd> Turbo Throttle • <kbd>S/↓</kbd> Brake • <kbd>A/D</kbd> Lane Weave • <kbd>SHIFT</kbd> Nitrous Overdrive
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
