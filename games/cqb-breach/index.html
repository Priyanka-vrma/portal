<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CQB: Tactical Breach // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #080d14; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; cursor: crosshair; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #0c1420; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(12, 20, 32, 0.85); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #f43f5e; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #fda4af; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(12, 20, 32, 0.85); border: 1px solid rgba(244, 63, 94, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #881337; border: 1px solid #be123c; border-radius: 4px; padding: 1px 5px; color: #fecdd3; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">SQUAD FORMATION // STATUS</div>
        <div class="hud-val" id="hud-squad" style="color:#00ff88;">4-MAN STACKED</div>
        <div class="hud-sub" id="hud-cmd">COMMAND: ADVANCE & CLEAR [E]</div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">ROOMS CLEARED</div>
        <div class="hud-val" id="hud-rooms" style="color:#f43f5e;">ROOM 1/3</div>
        <div class="hud-sub" id="hud-threat">THREAT LEVEL: ARMED HOSTILES</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">C4 CHARGES // FLASHBANGS</div>
        <div class="hud-val" id="hud-breach" style="color:#f59e0b;">2 C4 • 3 FLASH</div>
        <div class="hud-sub">DOOR DETONATE: [SPACE]</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>WASD</kbd> Move • <kbd>MOUSE</kbd> Aim Carbine • <kbd>LEFT-CLICK</kbd> Fire • <kbd>SPACE</kbd> Breach Charge • <kbd>E</kbd> Squad Orders
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
