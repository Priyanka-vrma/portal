<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canyon Apex: Rally Cross // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0804; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #140d07; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(24, 15, 8, 0.85); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #d97706; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20, 13, 7, 0.8); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #291c10; border: 1px solid #78350f; border-radius: 4px; padding: 1px 5px; color: #f59e0b; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">SPEED // TRACTION</div>
        <div class="hud-val" id="hud-speed">0 <span style="font-size:0.85rem;color:#f59e0b;">KM/H</span></div>
        <div class="hud-sub" id="hud-surface">SURFACE: LOOSE GRAVEL</div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">SUSPENSION TRAVEL</div>
        <div class="hud-val" id="hud-susp" style="color:#10b981;">300 mm</div>
        <div class="hud-sub" id="hud-rebound">REBOUND: DAMPED</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">RALLY STAGE TIMER</div>
        <div class="hud-val" id="hud-time" style="color:#f59e0b;">00:00.0</div>
        <div class="hud-sub" id="hud-split">SECTOR 1 • +0.00s</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>W/↑</kbd> Gas • <kbd>S/↓</kbd> Brake • <kbd>A/D</kbd> Counter-Steer • <kbd>SPACE</kbd> Hairpin Cut
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
