<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iron Guard: Base Defense // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f17; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; cursor: crosshair; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #0d1527; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(13, 21, 39, 0.85); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #60a5fa; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #93c5fd; }
    .base-health-wrap { width: 140px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .base-health-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s linear; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(13, 21, 39, 0.85); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #1e3a8a; border: 1px solid #3b82f6; border-radius: 4px; padding: 1px 5px; color: #93c5fd; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">BASE INTEGRITY // SHIELD</div>
        <div class="hud-val" id="hud-health">100%</div>
        <div class="base-health-wrap"><div class="base-health-fill" id="hud-health-bar"></div></div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">DEFENSE SECTOR</div>
        <div class="hud-val" id="hud-wave" style="color:#60a5fa;">WAVE 1</div>
        <div class="hud-sub" id="hud-targets">HOSTILES: 8 INBOUND</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">HEAVY HOWITZER</div>
        <div class="hud-val" id="hud-artillery" style="color:#f59e0b;">READY</div>
        <div class="hud-sub">CIWS AUTO-TRACK: ENGAGED</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>MOUSE</kbd> Aim Artillery • <kbd>LEFT-CLICK</kbd> Fire 155mm Shell • <kbd>SPACE</kbd> Vulcan CIWS Burst
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
