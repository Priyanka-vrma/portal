<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sniper Ghost: Desert Storm // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07090f; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; cursor: none; }
    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #23160a; }
    .hud-overlay { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud-card { background: rgba(8, 12, 20, 0.85); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: 8px; padding: 8px 14px; backdrop-filter: blur(8px); }
    .hud-title { font-size: 0.72rem; color: #10b981; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #6ee7b7; }
    .controls-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(8, 12, 20, 0.85); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #cbd5e1; pointer-events: none; }
    .controls-hint kbd { background: #134e4a; border: 1px solid #14b8a6; border-radius: 4px; padding: 1px 5px; color: #5eead4; font-family: monospace; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">BALLISTICS // WIND VECTOR</div>
        <div class="hud-val" id="hud-wind">4.2 M/S ➔</div>
        <div class="hud-sub" id="hud-drop">GRAVITY DROP: -2.8 MILS</div>
      </div>
      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">TARGET RANGE</div>
        <div class="hud-val" id="hud-range" style="color:#10b981;">680 METERS</div>
        <div class="hud-sub" id="hud-breath">BREATH HOLD: [SHIFT] STEADY</div>
      </div>
      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">HOSTILE TARGETS</div>
        <div class="hud-val" id="hud-score" style="color:#f59e0b;">0 / 5</div>
        <div class="hud-sub" id="hud-bullet">CHAMBER: .50 BMG READY</div>
      </div>
    </div>
    <div class="controls-hint">
      <kbd>MOUSE</kbd> Reticle Aim • <kbd>SHIFT</kbd> Hold Breath • <kbd>LEFT-CLICK</kbd> Fire • <kbd>SPACE</kbd> Zoom Mode
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
