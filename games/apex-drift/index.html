<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Drift: Tokyo Nights // Haunted Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #04060a; color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; width: 100%; height: 100%; background: #070a12; }
    .hud-overlay {
      position: absolute; top: 12px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .hud-card {
      background: rgba(8, 12, 22, 0.82);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 8px; padding: 8px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .hud-title { font-size: 0.72rem; color: #00ff88; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 2px; }
    .hud-val { font-size: 1.4rem; font-weight: 800; font-family: monospace; color: #fff; }
    .hud-sub { font-size: 0.75rem; color: #94a3b8; }
    .nitro-bar-wrap { width: 130px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .nitro-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #00ff88); transition: width 0.1s linear; }
    .controls-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(8, 12, 22, 0.75); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 6px 16px; font-size: 0.76rem; color: #94a3b8;
      pointer-events: none; text-align: center;
    }
    .controls-hint kbd {
      background: #1e293b; border: 1px solid #475569; border-radius: 4px;
      padding: 1px 5px; color: #00ff88; font-family: monospace; font-size: 0.76rem;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1280" height="720"></canvas>
    
    <div class="hud-overlay">
      <div class="hud-card">
        <div class="hud-title">SPEED // GEAR</div>
        <div class="hud-val" id="hud-speed">0 <span style="font-size:0.85rem;color:#00ff88;">KM/H</span></div>
        <div class="hud-sub" id="hud-gear">GEAR: N • 0 RPM</div>
      </div>

      <div class="hud-card" style="text-align: center;">
        <div class="hud-title">DRIFT SCORE</div>
        <div class="hud-val" id="hud-drift" style="color:#a855f7;">0</div>
        <div class="hud-sub" id="hud-combo">COMBO x1.0</div>
      </div>

      <div class="hud-card" style="text-align: right;">
        <div class="hud-title">NITRO BOOST (SHIFT)</div>
        <div class="nitro-bar-wrap"><div class="nitro-bar-fill" id="hud-nitro"></div></div>
        <div class="hud-sub" id="hud-lap" style="margin-top:4px;">LAP 1/3 • 00:00.0</div>
      </div>
    </div>

    <div class="controls-hint">
      <kbd>W/↑</kbd> Gas • <kbd>S/↓</kbd> Brake • <kbd>A/D</kbd> Steer • <kbd>SPACE</kbd> Drift Handbrake • <kbd>SHIFT</kbd> Nitro
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
