<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bajaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="50%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#3d1d28"/>
    </linearGradient>
    <linearGradient id="duneGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54251b"/>
      <stop offset="100%" stop-color="#1a0c0a"/>
    </linearGradient>
    <linearGradient id="duneGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#803823"/>
      <stop offset="100%" stop-color="#24100c"/>
    </linearGradient>
    <radialGradient id="lightBeam" cx="10%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08070d" stop-opacity="0"/>
    </radialGradient>
    <filter id="bajaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#bajaSky)"/>

  <!-- Desert Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="90" cy="50" r="1.5"/>
    <circle cx="160" cy="80" r="1"/>
    <circle cx="280" cy="40" r="1.5"/>
    <circle cx="450" cy="70" r="2"/>
    <circle cx="580" cy="45" r="1"/>
    <circle cx="710" cy="65" r="1.5"/>
    <circle cx="750" cy="110" r="1"/>
    <circle cx="340" cy="110" r="1"/>
  </g>

  <!-- Distant Desert Mesa / Ridge -->
  <polygon points="0,240 180,210 240,210 350,250 480,220 540,220 680,260 800,230 800,320 0,320" fill="#1b1224" opacity="0.7"/>

  <!-- Rolling Sand Dunes (Layer 1) -->
  <path d="M 0 310 Q 240 260 480 320 T 800 280 L 800 450 L 0 450 Z" fill="url(#duneGrad1)"/>

  <!-- Rolling Sand Dunes (Forefront Layer 2) -->
  <path d="M 0 370 Q 360 300 800 390 L 800 450 L 0 450 Z" fill="url(#duneGrad2)"/>
  <path d="M 0 372 Q 360 302 800 392" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Sand Spray / Roost Plume -->
  <g opacity="0.45">
    <circle cx="160" cy="330" r="70" fill="#ea580c" filter="url(#bajaGlow)"/>
    <circle cx="220" cy="340" r="50" fill="#f59e0b" filter="url(#bajaGlow)"/>
    <circle cx="110" cy="350" r="40" fill="#ea580c" filter="url(#bajaGlow)"/>
  </g>

  <!-- Trophy Truck 4x4 (Airborne Over Dune Crest) -->
  <g transform="translate(240, 160) rotate(-10) scale(1.05)">
    <!-- High-intensity Roof KC Light Bar -->
    <rect x="140" y="32" width="60" height="8" rx="2" fill="#1e293b"/>
    <circle cx="148" cy="36" r="4" fill="#ffffff" filter="url(#bajaGlow)"/>
    <circle cx="162" cy="36" r="4" fill="#ffffff" filter="url(#bajaGlow)"/>
    <circle cx="178" cy="36" r="4" fill="#ffffff" filter="url(#bajaGlow)"/>
    <circle cx="192" cy="36" r="4" fill="#ffffff" filter="url(#bajaGlow)"/>

    <!-- Light Cones Blasting Forward -->
    <polygon points="195,36 450,-30 480,180 195,40" fill="url(#lightBeam)" opacity="0.7"/>

    <!-- Roll Cage & Tubular Chassis -->
    <line x1="80" y1="45" x2="140" y2="40" stroke="#f97316" stroke-width="3"/>
    <line x1="140" y1="40" x2="190" y2="70" stroke="#f97316" stroke-width="3"/>
    <line x1="80" y1="45" x2="100" y2="75" stroke="#f97316" stroke-width="3"/>

    <!-- Body Panels (Fiberglass Trophy Truck Shell) -->
    <path d="M 40 85
             L 70 70
             L 130 45
             L 190 70
             L 245 78
             L 245 95
             L 215 95
             L 205 82
             L 175 82
             L 165 95
             L 100 95
             L 90 82
             L 60 82
             L 50 95
             Z"
          fill="#1c1917" stroke="#f97316" stroke-width="2"/>

    <!-- Dual Spare Tires Mounted in Rear Bed -->
    <circle cx="65" cy="62" r="16" fill="#09090b" stroke="#78716c" stroke-width="3"/>
    <circle cx="85" cy="58" r="16" fill="#09090b" stroke="#f97316" stroke-width="3"/>

    <!-- Long Travel Suspension Shocks (Fox/King Coilover Style) -->
    <line x1="75" y1="82" x2="70" y2="120" stroke="#38bdf8" stroke-width="4"/>
    <line x1="190" y1="82" x2="185" y2="120" stroke="#38bdf8" stroke-width="4"/>

    <!-- Massive Deep-Tread Mud/Sand Tires -->
    <circle cx="70" cy="122" r="26" fill="#0c0a09" stroke="#d97706" stroke-width="4"/>
    <circle cx="70" cy="122" r="14" fill="#292524" stroke="#78716c" stroke-width="2"/>
    <circle cx="70" cy="122" r="6" fill="#f97316"/>

    <circle cx="185" cy="122" r="26" fill="#0c0a09" stroke="#d97706" stroke-width="4"/>
    <circle cx="185" cy="122" r="14" fill="#292524" stroke="#78716c" stroke-width="2"/>
    <circle cx="185" cy="122" r="6" fill="#f97316"/>
  </g>

  <!-- Flying Sand Roost Clods -->
  <g fill="#ea580c">
    <circle cx="210" cy="380" r="5"/>
    <circle cx="270" cy="360" r="3"/>
    <circle cx="310" cy="390" r="4"/>
    <circle cx="180" cy="400" r="6"/>
  </g>

  <!-- Compass / Elevation HUD -->
  <g transform="translate(630, 36)" opacity="0.85">
    <rect width="134" height="46" rx="4" fill="#1c120c" stroke="#451a03" stroke-width="1"/>
    <text x="12" y="18" fill="#f59e0b" font-family="'Inter', monospace" font-size="9" letter-spacing="1">DESERT WAYPOINT</text>
    <text x="12" y="34" fill="#fdba74" font-family="'Inter', monospace" font-size="13" font-weight="800">31°45' N 115°54' W</text>
  </g>

  <!-- Badge Pill -->
  <rect x="36" y="32" width="138" height="24" rx="4" fill="#1c120c" fill-opacity="0.85" stroke="#f97316" stroke-width="1"/>
  <text x="46" y="48" fill="#fdba74" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">REALISTIC RACING</text>

  <!-- Game Title -->
  <text x="36" y="92" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">BAJA DUNES</text>
  <text x="38" y="112" fill="#fb923c" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">4X4 DESERT OFFROAD // EXTREME RALLY</text>

  <!-- Framing Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#f97316" stroke-width="2" fill="none"/>
  <path d="M 780 30 L 780 20 L 770 20" stroke="#f97316" stroke-width="2" fill="none"/>
  <path d="M 20 420 L 20 430 L 30 430" stroke="#f97316" stroke-width="2" fill="none"/>
  <path d="M 780 420 L 780 430 L 770 430" stroke="#f97316" stroke-width="2" fill="none"/>
</svg>
