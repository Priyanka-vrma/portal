<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cmAsphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="apexGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#cmSky)"/>

  <!-- Stadium Floodlights in the distance -->
  <g opacity="0.6">
    <line x1="120" y1="180" x2="120" y2="90" stroke="#334155" stroke-width="3"/>
    <ellipse cx="120" cy="90" rx="14" ry="6" fill="#ffffff" filter="url(#cmGlow)"/>
    <polygon points="120,90 40,240 200,240" fill="#ffffff" opacity="0.08"/>

    <line x1="680" y1="180" x2="680" y2="85" stroke="#334155" stroke-width="3"/>
    <ellipse cx="680" cy="85" rx="14" ry="6" fill="#ffffff" filter="url(#cmGlow)"/>
    <polygon points="680,85 600,240 760,240" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- Grand Prix Asphalt Circuit Surface -->
  <polygon points="0,200 800,180 800,450 0,450" fill="url(#cmAsphalt)"/>

  <!-- Curving Circuit Kerb (Red and White alternating rumble strip) -->
  <g>
    <!-- Kerb border -->
    <path d="M 0 340 C 250 340, 420 280, 800 220" stroke="#0f172a" stroke-width="26" fill="none"/>
    <!-- Red/White segments -->
    <path d="M 40 338 L 80 336" stroke="#ef4444" stroke-width="20"/>
    <path d="M 85 335 L 125 333" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 130 332 L 170 329" stroke="#ef4444" stroke-width="20"/>
    <path d="M 175 328 L 215 324" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 220 323 L 260 318" stroke="#ef4444" stroke-width="20"/>
    <path d="M 265 317 L 305 311" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 310 310 L 350 302" stroke="#ef4444" stroke-width="20"/>
    <path d="M 355 301 L 395 293" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 400 292 L 440 283" stroke="#ef4444" stroke-width="20"/>
    <path d="M 445 282 L 485 273" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 490 272 L 530 262" stroke="#ef4444" stroke-width="20"/>
    <path d="M 535 261 L 575 251" stroke="#f8fafc" stroke-width="20"/>
    <path d="M 580 250 L 620 240" stroke="#ef4444" stroke-width="20"/>
    <path d="M 625 239 L 665 230" stroke="#f8fafc" stroke-width="20"/>
  </g>

  <!-- Glowing Telemetry Apex Racing Line -->
  <path d="M 0 420 C 350 410, 480 310, 800 230" stroke="url(#apexGlowGrad)" stroke-width="4" fill="none" opacity="0.85" filter="url(#cmGlow)"/>

  <!-- Formula 1 Prototype Racer Silhouette -->
  <g transform="translate(380, 240) rotate(-14) scale(0.95)">
    <!-- Shadow -->
    <ellipse cx="60" cy="50" rx="140" ry="12" fill="#000000" opacity="0.8"/>

    <!-- Front Wing -->
    <rect x="180" y="44" width="25" height="4" rx="2" fill="#8b5cf6"/>
    <polygon points="185,40 205,40 198,54 180,54" fill="#38bdf8"/>
    <line x1="175" y1="36" x2="205" y2="36" stroke="#ffffff" stroke-width="2"/>

    <!-- Monocoque / Chassis -->
    <path d="M -70 30
             L -40 25
             L 20 25
             L 80 20
             L 140 32
             L 190 42
             L 170 48
             L 110 46
             L 40 44
             L -30 46
             L -70 42
             Z"
          fill="#111827" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Halo Safety Cockpit & Helmet -->
    <ellipse cx="35" cy="22" r="7" fill="#ef4444"/>
    <path d="M 20 24 Q 45 12 70 26" stroke="#64748b" stroke-width="3" fill="none"/>

    <!-- Engine Intake Airbox -->
    <polygon points="10,8 35,8 25,25 0,25" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>

    <!-- Rear Wing & Endplates -->
    <rect x="-85" y="0" width="22" height="34" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="-85" y1="6" x2="-60" y2="6" stroke="#38bdf8" stroke-width="4"/>

    <!-- Open Wheels / Slicks -->
    <!-- Front Right Wheel -->
    <ellipse cx="155" cy="46" rx="18" ry="14" fill="#090b10" stroke="#8b5cf6" stroke-width="2"/>
    <ellipse cx="155" cy="46" rx="8" ry="6" fill="#334155"/>
    <!-- Front Left Wheel -->
    <ellipse cx="130" cy="24" rx="14" ry="10" fill="#090b10" stroke="#475569" stroke-width="1.5"/>
    <!-- Rear Right Wheel -->
    <ellipse cx="-40" cy="44" rx="24" ry="18" fill="#090b10" stroke="#8b5cf6" stroke-width="2.5"/>
    <ellipse cx="-40" cy="44" rx="11" ry="8" fill="#334155"/>
    <!-- Rear Left Wheel -->
    <ellipse cx="-60" cy="20" rx="18" ry="12" fill="#090b10" stroke="#475569" stroke-width="1.5"/>

    <!-- Rain / Rear Safety Red Flashing LED -->
    <rect x="-86" y="32" width="6" height="6" fill="#ef4444" filter="url(#cmGlow)"/>
  </g>

  <!-- Telemetry Watermark Overlay -->
  <g transform="translate(630, 36)" opacity="0.85">
    <rect width="134" height="50" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="18" fill="#8b5cf6" font-family="'Inter', monospace" font-size="9" letter-spacing="1">BEST LAP // S1-S3</text>
    <text x="12" y="38" fill="#10b981" font-family="'Inter', monospace" font-size="16" font-weight="900">1:18.420</text>
    <circle cx="116" cy="24" r="5" fill="#10b981" filter="url(#cmGlow)"/>
  </g>

  <!-- Badge Pill -->
  <rect x="36" y="32" width="138" height="24" rx="4" fill="#131422" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1"/>
  <text x="46" y="48" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">REALISTIC RACING</text>

  <!-- Game Title -->
  <text x="36" y="92" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">CIRCUIT MASTER</text>
  <text x="38" y="112" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">PRO ASPHALT // FORMULA DYNAMICS</text>

  <!-- Framing Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  <path d="M 780 30 L 780 20 L 770 20" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  <path d="M 20 420 L 20 430 L 30 430" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  <path d="M 780 420 L 780 430 L 770 430" stroke="#8b5cf6" stroke-width="2" fill="none"/>
</svg>
