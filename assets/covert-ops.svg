<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040609"/>
      <stop offset="50%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#161226"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="cyberAlley" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="covertGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Alley Background -->
  <rect width="800" height="450" fill="url(#cyberSky)"/>
  <ellipse cx="400" cy="200" rx="350" ry="180" fill="url(#cyberAlley)"/>

  <!-- High-rise Cyberpunk Architecture -->
  <polygon points="60,0 60,320 0,380 0,0" fill="#0b0f19"/>
  <polygon points="740,0 740,320 800,380 800,0" fill="#0b0f19"/>

  <!-- Neon Vertical Signage (Holographic Japanese/Sector Tags) -->
  <rect x="75" y="80" width="22" height="110" rx="4" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.5" filter="url(#covertGlow)"/>
  <text x="86" y="105" fill="#38bdf8" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">区</text>
  <text x="86" y="130" fill="#38bdf8" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">域</text>
  <text x="86" y="155" fill="#38bdf8" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">0</text>
  <text x="86" y="175" fill="#38bdf8" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">7</text>

  <rect x="705" y="60" width="22" height="140" rx="4" fill="#2e1065" stroke="#ec4899" stroke-width="1.5" filter="url(#covertGlow)"/>
  <text x="716" y="90" fill="#f472b6" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">S</text>
  <text x="716" y="115" fill="#f472b6" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">E</text>
  <text x="716" y="140" fill="#f472b6" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">C</text>
  <text x="716" y="165" fill="#f472b6" font-family="'Inter', monospace" font-size="12" font-weight="900" text-anchor="middle">9</text>

  <!-- Wet Concrete Floor with Reflections -->
  <polygon points="0,320 800,320 800,450 0,450" fill="#090d16"/>
  <ellipse cx="400" cy="380" rx="300" ry="25" fill="#06b6d4" opacity="0.12" filter="url(#covertGlow)"/>

  <!-- Tactical Infiltration Operative Silhouette -->
  <g transform="translate(340, 140)">
    <!-- Shadow -->
    <ellipse cx="50" cy="270" rx="60" ry="14" fill="#000000" opacity="0.9"/>

    <!-- Tactical Operative Body -->
    <!-- Legs -->
    <path d="M 25 210 L 15 270 L 35 270 L 45 210 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 55 210 L 65 270 L 85 270 L 75 210 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Torso / Tactical Plate Carrier -->
    <polygon points="20,130 80,130 75,215 25,215" fill="#131c2e" stroke="#334155" stroke-width="1.5"/>
    <rect x="35" y="145" width="30" height="20" rx="2" fill="#1e293b"/>
    <line x1="38" y1="175" x2="62" y2="175" stroke="#ef4444" stroke-width="2"/>

    <!-- Tactical Helmet & Night-Vision / Cybernetic Visor -->
    <ellipse cx="50" cy="100" rx="18" ry="22" fill="#0f172a"/>
    <path d="M 40 98 L 65 98 L 60 106 L 40 106 Z" fill="#06b6d4" filter="url(#covertGlow)"/>

    <!-- Arms & Silenced Tactical Carbine / SMG -->
    <path d="M 20 130 L -10 160 L 40 170" stroke="#131c2e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 80 130 L 70 170" stroke="#131c2e" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Weapon Body -->
    <rect x="-30" y="152" width="70" height="14" rx="2" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <!-- Suppressor / Silencer -->
    <rect x="-65" y="155" width="36" height="8" rx="2" fill="#030712" stroke="#334155" stroke-width="1"/>
    <!-- Magazine -->
    <polygon points="10,165 5,190 18,190 20,165" fill="#1e293b"/>

    <!-- Red Laser Pointer Beam -->
    <line x1="-65" y1="159" x2="-340" y2="180" stroke="#ef4444" stroke-width="2" filter="url(#covertGlow)"/>
    <circle cx="-340" cy="180" r="3" fill="#ffffff" filter="url(#covertGlow)"/>
  </g>

  <!-- Futuristic Holographic Reticle Target HUD -->
  <g transform="translate(180, 240)" opacity="0.85">
    <circle cx="0" cy="0" r="28" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="10 8" fill="none" filter="url(#covertGlow)"/>
    <circle cx="0" cy="0" r="8" stroke="#ef4444" stroke-width="1" fill="none"/>
    <line x1="-38" y1="0" x2="-14" y2="0" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="14" y1="0" x2="38" y2="0" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="0" y1="-38" x2="0" y2="-14" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="38" stroke="#ef4444" stroke-width="1.5"/>
    <text x="35" y="-12" fill="#ef4444" font-family="'Inter', monospace" font-size="9" font-weight="700">LOCK // 98.4%</text>
  </g>

  <!-- Telemetry Overlay Top Right -->
  <g transform="translate(630, 36)" opacity="0.85">
    <rect width="134" height="46" rx="4" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="18" fill="#ec4899" font-family="'Inter', monospace" font-size="9" letter-spacing="1">PROTOCOL</text>
    <text x="12" y="34" fill="#f43f5e" font-family="'Inter', monospace" font-size="13" font-weight="800">SILENT / AP-9</text>
    <circle cx="116" cy="22" r="5" fill="#10b981"/>
  </g>

  <!-- Badge Pill -->
  <rect x="36" y="32" width="138" height="24" rx="4" fill="#1f131b" fill-opacity="0.85" stroke="#ef4444" stroke-width="1"/>
  <text x="46" y="48" fill="#f87171" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ARMS &amp; COMBAT</text>

  <!-- Game Title -->
  <text x="36" y="92" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">COVERT OPS</text>
  <text x="38" y="112" fill="#f472b6" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">NEON SECTOR // STEALTH INFILTRATION</text>

  <!-- Framing Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 780 30 L 780 20 L 770 20" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 20 420 L 20 430 L 30 430" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 780 420 L 780 430 L 770 430" stroke="#ef4444" stroke-width="2" fill="none"/>
</svg>
