<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="breachBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="60%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#1e141a"/>
    </linearGradient>
    <radialGradient id="breachBlast" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#7f1d1d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flashCone" cx="0%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="cqbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Room -->
  <rect width="800" height="450" fill="url(#breachBg)"/>

  <!-- Industrial Steel Corridor Framing / Wall -->
  <polygon points="0,0 240,60 240,400 0,450" fill="#0c0e14"/>
  <line x1="240" y1="60" x2="240" y2="400" stroke="#334155" stroke-width="4"/>

  <!-- Breach Doorway Opening -->
  <rect x="420" y="70" width="220" height="340" fill="#08080c" stroke="#1e293b" stroke-width="3"/>

  <!-- Breach Charge Detonation & Fiery Sparks -->
  <ellipse cx="530" cy="240" rx="190" ry="160" fill="url(#breachBlast)"/>

  <!-- Flying Splinters / Debris -->
  <polygon points="560,180 575,175 570,190" fill="#f59e0b"/>
  <polygon points="480,210 495,200 488,220" fill="#ef4444"/>
  <polygon points="540,290 555,305 538,300" fill="#fbbf24"/>
  <polygon points="600,230 618,225 610,240" fill="#ffffff" filter="url(#cqbGlow)"/>

  <!-- Smoke Billows -->
  <ellipse cx="460" cy="330" rx="100" ry="40" fill="#ef4444" opacity="0.2" filter="url(#cqbGlow)"/>
  <ellipse cx="580" cy="310" rx="120" ry="50" fill="#f59e0b" opacity="0.15" filter="url(#cqbGlow)"/>

  <!-- Tactical Operator Team (Breachers Stacking & Infiltrating) -->
  <g transform="translate(140, 150)">
    <!-- Point Man Silhouette -->
    <!-- Shadow -->
    <ellipse cx="140" cy="270" rx="45" ry="12" fill="#000000" opacity="0.9"/>

    <!-- Point Man Helmet & Quad-Eye NVG Goggles -->
    <ellipse cx="145" cy="85" rx="16" ry="18" fill="#0b0f17"/>
    <circle cx="152" cy="85" r="3" fill="#10b981" filter="url(#cqbGlow)"/>
    <circle cx="158" cy="85" r="3" fill="#10b981" filter="url(#cqbGlow)"/>

    <!-- Point Man Torso with Armored Vest -->
    <path d="M 125 105 L 170 105 L 165 190 L 125 190 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Point Man Legs Moving In -->
    <path d="M 130 190 L 120 270 L 140 270 L 145 190 Z" fill="#0a0e17"/>
    <path d="M 150 190 L 165 270 L 185 270 L 165 190 Z" fill="#0a0e17"/>

    <!-- Tactical Shotgun / Assault Rifle with Weapon Light -->
    <polygon points="145,130 220,135 220,148 145,148" fill="#1e293b"/>
    <rect x="220" y="132" width="28" height="12" fill="#0f172a"/>
    
    <!-- Ultra High Lumen Weapon Light Beam Blasting Through Doorway -->
    <polygon points="248,138 680,60 720,380 248,142" fill="url(#flashCone)"/>
    <circle cx="248" cy="138" r="6" fill="#ffffff" filter="url(#cqbGlow)"/>

    <!-- Tactical Red Dot Laser Aiming into Target Room -->
    <line x1="240" y1="134" x2="620" y2="170" stroke="#ef4444" stroke-width="2" filter="url(#cqbGlow)"/>
    <circle cx="620" cy="170" r="3" fill="#ef4444" filter="url(#cqbGlow)"/>
  </g>

  <!-- Second Operator (Support Stacking Behind) -->
  <g transform="translate(60, 160)" opacity="0.85">
    <ellipse cx="110" cy="88" rx="15" ry="18" fill="#090d14"/>
    <path d="M 95 108 L 135 108 L 130 195 L 95 195 Z" fill="#0c121d"/>
    <path d="M 100 195 L 90 270 L 110 270 L 115 195 Z" fill="#06090e"/>
    <path d="M 120 195 L 128 270 L 145 270 L 130 195 Z" fill="#06090e"/>
    <line x1="120" y1="130" x2="165" y2="120" stroke="#1e293b" stroke-width="8"/>
  </g>

  <!-- Door Frame Shards & Warning Decal -->
  <rect x="36" y="32" width="138" height="24" rx="4" fill="#1f1115" fill-opacity="0.85" stroke="#ef4444" stroke-width="1"/>
  <text x="46" y="48" fill="#f87171" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ARMS &amp; COMBAT</text>

  <!-- Game Title -->
  <text x="36" y="92" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">CQB BREACH</text>
  <text x="38" y="112" fill="#fca5a5" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">TACTICAL BREACH // COMBAT ENGAGEMENT</text>

  <!-- Telemetry Overlay Top Right -->
  <g transform="translate(630, 36)" opacity="0.85">
    <rect width="134" height="46" rx="4" fill="#140d10" stroke="#33181f" stroke-width="1"/>
    <text x="12" y="18" fill="#ef4444" font-family="'Inter', monospace" font-size="9" letter-spacing="1">BREACH STATUS</text>
    <text x="12" y="34" fill="#fbbf24" font-family="'Inter', monospace" font-size="13" font-weight="800">CHARGE DETONATED</text>
    <circle cx="116" cy="22" r="5" fill="#ef4444" filter="url(#cqbGlow)"/>
  </g>

  <!-- Framing Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 780 30 L 780 20 L 770 20" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 20 420 L 20 430 L 30 430" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 780 420 L 780 430 L 770 430" stroke="#ef4444" stroke-width="2" fill="none"/>
</svg>
