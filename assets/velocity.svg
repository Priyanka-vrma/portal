<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="velSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="60%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="speedTarmac" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="laserRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="tunnelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#060912" stop-opacity="0"/>
    </radialGradient>
    <filter id="velGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="800" height="450" fill="url(#velSky)"/>

  <!-- High-speed Tunnel / Overhead Gantry Lights -->
  <ellipse cx="400" cy="220" rx="350" ry="200" fill="url(#tunnelGlow)"/>

  <!-- Overhead Autobahn Electronic Signboard -->
  <rect x="260" y="100" width="280" height="40" rx="4" fill="#0c1322" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="125" fill="#38bdf8" font-family="'Inter', monospace" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">A8 // NO SPEED LIMIT</text>
  <circle cx="280" cy="120" r="4" fill="#10b981"/>
  <circle cx="520" cy="120" r="4" fill="#10b981"/>
  <line x1="260" y1="120" x2="120" y2="220" stroke="#334155" stroke-width="2"/>
  <line x1="540" y1="120" x2="680" y2="220" stroke="#334155" stroke-width="2"/>

  <!-- Tarmac Road (Vanishing Point at 400, 220) -->
  <polygon points="0,220 800,220 800,450 0,450" fill="url(#speedTarmac)"/>

  <!-- Road Dividers & Speed Blur Streaks -->
  <line x1="400" y1="220" x2="400" y2="450" stroke="#38bdf8" stroke-width="3" stroke-dasharray="30 20" filter="url(#velGlow)"/>
  <line x1="400" y1="220" x2="100" y2="450" stroke="#1e293b" stroke-width="2"/>
  <line x1="400" y1="220" x2="700" y2="450" stroke="#1e293b" stroke-width="2"/>
  <line x1="400" y1="220" x2="250" y2="450" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="40 25" opacity="0.4"/>
  <line x1="400" y1="220" x2="550" y2="450" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="40 25" opacity="0.4"/>

  <!-- Barrier Guardrails with Reflectors -->
  <line x1="400" y1="220" x2="-20" y2="380" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="220" x2="820" y2="380" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>

  <!-- High-Speed Hypercar Rear Perspective -->
  <g transform="translate(400, 310)">
    <!-- Shadow & Diffuser Glow -->
    <ellipse cx="0" cy="55" rx="140" ry="12" fill="#ef4444" opacity="0.5" filter="url(#velGlow)"/>
    <ellipse cx="0" cy="52" rx="130" ry="8" fill="#000000"/>

    <!-- Hypercar Body Rear Silhouette -->
    <path d="M -110 40
             L -105 20
             L -80 0
             L -55 -25
             L 55 -25
             L 80 0
             L 105 20
             L 110 40
             L 95 48
             L 60 48
             L 50 35
             L -50 35
             L -60 48
             L -95 48
             Z" 
          fill="#0c1017" stroke="#1e293b" stroke-width="2"/>

    <!-- Rear Window / Engine Deck Louvers -->
    <polygon points="-40,-20 40,-20 50,-5 -50,-5" fill="#111827"/>
    <line x1="-35" y1="-16" x2="35" y2="-16" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <line x1="-38" y1="-10" x2="38" y2="-10" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

    <!-- Full-Width OLED Red Light Bar -->
    <path d="M -95 18 Q 0 8 95 18" stroke="url(#laserRed)" stroke-width="5" fill="none" filter="url(#velGlow)"/>
    <path d="M -90 19 Q 0 9 90 19" stroke="#ffffff" stroke-width="1.5" fill="none"/>

    <!-- Dual Exhaust Blast / Blue Flame -->
    <ellipse cx="-30" cy="40" rx="8" ry="4" fill="#38bdf8" filter="url(#velGlow)"/>
    <ellipse cx="30" cy="40" rx="8" ry="4" fill="#38bdf8" filter="url(#velGlow)"/>
    <line x1="-30" y1="42" x2="-30" y2="70" stroke="#38bdf8" stroke-width="4" opacity="0.7" filter="url(#velGlow)"/>
    <line x1="30" y1="42" x2="30" y2="70" stroke="#38bdf8" stroke-width="4" opacity="0.7" filter="url(#velGlow)"/>

    <!-- Carbon Fiber Aero Diffuser Fins -->
    <line x1="-20" y1="36" x2="-20" y2="48" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="36" x2="0" y2="48" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="48" stroke="#64748b" stroke-width="2"/>

    <!-- Massive Rear Tires -->
    <rect x="-115" y="24" width="22" height="30" rx="5" fill="#0a0d14"/>
    <rect x="93" y="24" width="22" height="30" rx="5" fill="#0a0d14"/>
  </g>

  <!-- High-Speed Motion Lines -->
  <g opacity="0.75">
    <line x1="30" y1="260" x2="0" y2="420" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="15 25"/>
    <line x1="770" y1="260" x2="800" y2="420" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="15 25"/>
    <line x1="320" y1="350" x2="220" y2="440" stroke="#ef4444" stroke-width="2" stroke-dasharray="30 20"/>
    <line x1="480" y1="350" x2="580" y2="440" stroke="#ef4444" stroke-width="2" stroke-dasharray="30 20"/>
  </g>

  <!-- Speedometer HUD Circular Dial Left -->
  <g transform="translate(680, 360)">
    <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <path d="M -30 20 A 36 36 0 1 1 30 20" stroke="#38bdf8" stroke-width="4" fill="none" stroke-dasharray="120" stroke-dashoffset="20"/>
    <text x="0" y="-4" fill="#ffffff" font-family="'Inter', monospace" font-size="16" font-weight="900" text-anchor="middle">342</text>
    <text x="0" y="14" fill="#64748b" font-family="'Inter', monospace" font-size="8" font-weight="600" text-anchor="middle">KM/H</text>
  </g>

  <!-- Badge Pill -->
  <rect x="36" y="32" width="138" height="24" rx="4" fill="#0c121d" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
  <text x="46" y="48" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">REALISTIC RACING</text>

  <!-- Game Title -->
  <text x="36" y="92" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">VELOCITY</text>
  <text x="38" y="112" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">AUTOBAHN PURSUIT // UNLIMITED SPEED</text>

  <!-- Framing Accents -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 780 30 L 780 20 L 770 20" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 20 420 L 20 430 L 30 430" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 780 420 L 780 430 L 770 430" stroke="#38bdf8" stroke-width="2" fill="none"/>
</svg>
